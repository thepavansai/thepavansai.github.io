    <script>
      (function () {
        var preferredHost = "thepavansai.github.io";
        var loc = window.location;
        var host = loc.hostname;
        var shouldCanonicalize = host === preferredHost || host === "www.thepavansai.github.io";
        if (!shouldCanonicalize) {
          return;
        }

        var normalizedPath = loc.pathname === "/index.html" ? "/" : loc.pathname;
        var needsRedirect =
          loc.protocol !== "https:" || host !== preferredHost || normalizedPath !== loc.pathname;

        if (needsRedirect) {
          var target = "https://" + preferredHost + normalizedPath + loc.search + loc.hash;
          if (target !== loc.href) {
            window.location.replace(target);
          }
        }
      })();
    </script>
